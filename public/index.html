  <script>
    // Thème et langue appliqués avant le rendu (évite le flash)
    try {
      var th = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = th;
      var lg = localStorage.getItem('lang');
      if (lg === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
    } catch (e) {}
  </script>
